<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VALEO | Vision AI</title>

<style>

:root {
    --lime: #B9FF00;
    --bg: #030506;
    --panel: rgba(7, 10, 11, 0.82);
    --text: rgba(255,255,255,0.9);
    --muted: rgba(255,255,255,0.38);
    --line: rgba(255,255,255,0.09);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family:
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
}

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(185,255,0,0.045),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,0.015),
            transparent 60%
        ),
        #030506;
}

.grid {
    position: absolute;
    inset: -100px;
    opacity: 0.5;

    background-image:
        linear-gradient(
            rgba(185,255,0,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(185,255,0,0.018) 1px,
            transparent 1px
        );

    background-size: 60px 60px;

    transform:
        perspective(600px)
        rotateX(55deg)
        scale(1.5);

    transform-origin: center bottom;

    animation:
        gridMove 20s linear infinite;
}

@keyframes gridMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 60px;
    }

}

.vignette {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,0.35) 70%,
            rgba(0,0,0,0.85) 100%
        );
}

.top-bar {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    padding: 0 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(0,0,0,0.22);

    backdrop-filter: blur(10px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-mark {
    width: 8px;
    height: 8px;

    background: var(--lime);

    border-radius: 50%;

    box-shadow:
        0 0 12px var(--lime);
}

.brand-text {
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 600;

    color:
        rgba(255,255,255,0.75);
}

.top-right {
    display: flex;
    align-items: center;

    gap: 28px;

    font-size: 9px;
    letter-spacing: 1.5px;

    color: var(--muted);
}

.online {
    display: flex;
    align-items: center;
    gap: 8px;
}

.online-dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--lime);

    box-shadow:
        0 0 8px var(--lime);
}

.main {
    position: absolute;

    top: 70px;
    bottom: 50px;

    left: 0;
    right: 0;

    display: flex;

    align-items: center;
    justify-content: center;
}

.panel {
    position: relative;

    width: min(900px, 90vw);
    min-height: 540px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: var(--panel);

    border:
        1px solid
        rgba(255,255,255,0.08);

    box-shadow:
        0 40px 100px
        rgba(0,0,0,0.7),

        inset 0 1px 0
        rgba(255,255,255,0.04);

    backdrop-filter: blur(20px);

    animation:
        panelIn 1s
        cubic-bezier(.22,1,.36,1);
}

@keyframes panelIn {

    from {
        opacity: 0;

        transform:
            scale(0.96)
            translateY(20px);
    }

    to {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }

}

.corner {
    position: absolute;

    width: 25px;
    height: 25px;

    border-color:
        rgba(185,255,0,0.5);

    border-style: solid;
}

.corner.tl {
    top: -1px;
    left: -1px;

    border-width:
        2px 0 0 2px;
}

.corner.tr {
    top: -1px;
    right: -1px;

    border-width:
        2px 2px 0 0;
}

.corner.bl {
    bottom: -1px;
    left: -1px;

    border-width:
        0 0 2px 2px;
}

.corner.br {
    bottom: -1px;
    right: -1px;

    border-width:
        0 2px 2px 0;
}

.system-label {
    position: absolute;

    top: 35px;

    display: flex;
    align-items: center;

    gap: 12px;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: var(--muted);
}

.system-label::before,
.system-label::after {
    content: "";

    width: 45px;
    height: 1px;

    background:
        rgba(185,255,0,0.25);
}

.scanner {
    position: relative;

    width: 220px;
    height: 220px;

    margin-bottom: 30px;

    display: flex;

    align-items: center;
    justify-content: center;
}

.ring {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    border:
        1px solid
        rgba(185,255,0,0.18);

    box-shadow:
        0 0 40px
        rgba(185,255,0,0.03);

    animation:
        ringPulse 3s
        ease-in-out infinite;
}

@keyframes ringPulse {

    0%,
    100% {
        transform: scale(0.95);
        opacity: 0.5;
    }

    50% {
        transform: scale(1.03);
        opacity: 1;
    }

}

.ring::before {
    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 50%;

    border:
        2px solid transparent;

    border-top-color:
        var(--lime);

    border-right-color:
        rgba(185,255,0,0.25);

    animation:
        rotate 4s
        linear infinite;
}

@keyframes rotate {

    to {
        transform: rotate(360deg);
    }

}

.inner-ring {
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(185,255,0,0.2);

    animation:
        rotateReverse 12s
        linear infinite;
}

@keyframes rotateReverse {

    to {
        transform: rotate(-360deg);
    }

}

.logo {
    position: relative;

    z-index: 5;

    width: 135px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(185,255,0,0.12)
        );

    animation:
        logoPulse 3s
        ease-in-out infinite;
}

.logo img {
    display: block;

    width: 100%;
    height: auto;
}

@keyframes logoPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.035);
    }

}

.scan-line {
    position: absolute;

    left: 35px;
    right: 35px;

    height: 1px;

    background: var(--lime);

    box-shadow:
        0 0 8px var(--lime),
        0 0 20px rgba(185,255,0,0.4);

    opacity: 0.8;

    animation:
        scan 2.8s
        ease-in-out infinite;
}

@keyframes scan {

    0% {
        top: 40px;
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    50% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        top: 180px;
        opacity: 0;
    }

}

.title {
    font-size:
        clamp(20px, 3vw, 27px);

    font-weight: 300;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: var(--text);

    margin-bottom: 10px;
}

.subtitle {
    font-size: 10px;

    letter-spacing: 2px;

    color: var(--muted);

    text-transform: uppercase;
}

.progress-area {
    width: min(520px, 75%);

    margin-top: 40px;
}

.progress-top {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;
}

.progress-status {
    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 10px;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,0.55);
}

.status-light {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--lime);

    box-shadow:
        0 0 8px var(--lime);
}

.percentage {
    font-size: 11px;

    font-weight: 600;

    letter-spacing: 1px;

    color: var(--lime);
}

.progress-container {
    width: 100%;

    height: 3px;

    background:
        rgba(255,255,255,0.08);

    overflow: hidden;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background: var(--lime);

    box-shadow:
        0 0 10px var(--lime);

    transition:
        width 0.05s linear;
}

.modules {
    display: flex;

    gap: 45px;

    margin-top: 30px;
}

.module {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 7px;
}

.module-name {
    font-size: 8px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,0.3);
}

.module-status {
    font-size: 8px;

    letter-spacing: 1px;

    color:
        rgba(185,255,0,0.6);
}

.footer {
    position: absolute;

    bottom: 18px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 8px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,0.2);

    text-transform: uppercase;
}

@media (max-width: 700px) {

    .top-bar {
        padding: 0 20px;
    }

    .top-right {
        display: none;
    }

    .panel {
        width: 92vw;
        min-height: 500px;
    }

    .scanner {
        width: 180px;
        height: 180px;
    }

    .inner-ring {
        width: 125px;
        height: 125px;
    }

    .logo {
        width: 110px;
    }

    .progress-area {
        width: 75%;
    }

    .modules {
        gap: 20px;
    }

}

</style>

</head>

<body>

<div class="background">

    <div class="grid"></div>

    <div class="vignette"></div>

</div>

<header class="top-bar">

    <div class="brand">

        <span class="brand-mark"></span>

        <span class="brand-text">
            VALEO
        </span>

    </div>

    <div class="top-right">

        <div class="online">

            <span class="online-dot"></span>

            SYSTEM ONLINE

        </div>

        <span>
            VISION AI PLATFORM
        </span>

        <span>
            v1.0.0
        </span>

    </div>

</header>

<main class="main">

    <section class="panel">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="system-label">
            INDUSTRIAL VISION SYSTEM
        </div>

        <div class="scanner">

            <div class="ring"></div>

            <div class="inner-ring"></div>

            <div class="scan-line"></div>

            <div class="logo">

                <img
                    src="images%20(1).png"
                    alt="VALEO"
                >

            </div>

        </div>

        <h1 class="title">
            Smart Vision
        </h1>

        <p class="subtitle">
            Artificial Intelligence Inspection Platform
        </p>

        <div class="progress-area">

            <div class="progress-top">

                <div class="progress-status">

                    <span
                        class="status-light">
                    </span>

                    <span id="status">
                        Initializing vision engine
                    </span>

                </div>

                <span
                    class="percentage"
                    id="percentage">
                    0%
                </span>

            </div>

            <div class="progress-container">

                <div
                    class="progress-bar"
                    id="progressBar">
                </div>

            </div>

        </div>

        <div class="modules">

            <div class="module">

                <span class="module-name">
                    CAMERA
                </span>

                <span class="module-status">
                    READY
                </span>

            </div>

            <div class="module">

                <span class="module-name">
                    AI ENGINE
                </span>

                <span class="module-status">
                    READY
                </span>

            </div>

            <div class="module">

                <span class="module-name">
                    VISION
                </span>

                <span class="module-status">
                    READY
                </span>

            </div>

            <div class="module">

                <span class="module-name">
                    DATABASE
                </span>

                <span class="module-status">
                    READY
                </span>

            </div>

        </div>

    </section>

</main>

<footer class="footer">

    INTELLIGENT INDUSTRIAL INSPECTION
    &nbsp;•&nbsp;
    POWERED BY AI VISION TECHNOLOGY

</footer>

<script>

const targetPage = "login.html";

const duration = 4200;

const startDelay = 500;

const redirectDelay = 600;

const progressBar =
    document.getElementById("progressBar");

const percentage =
    document.getElementById("percentage");

const status =
    document.getElementById("status");

const statuses = [

    {
        progress: 0,
        text: "Initializing vision engine"
    },

    {
        progress: 15,
        text: "Loading AI classification model"
    },

    {
        progress: 35,
        text: "Connecting industrial camera"
    },

    {
        progress: 55,
        text: "Initializing detection system"
    },

    {
        progress: 72,
        text: "Checking vision services"
    },

    {
        progress: 88,
        text: "Synchronizing inspection platform"
    },

    {
        progress: 98,
        text: "System ready"
    }

];

function getStatus(value) {

    let current =
        statuses[0].text;

    statuses.forEach(item => {

        if (value >= item.progress) {
            current = item.text;
        }

    });

    return current;
}

function startLoader() {

    const startTime =
        performance.now();

    let lastStatus = "";

    function animate(currentTime) {

        const elapsed =
            currentTime - startTime;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );

        const value =
            Math.floor(
                progress * 100
            );

        progressBar.style.width =
            value + "%";

        percentage.textContent =
            value + "%";

        const currentStatus =
            getStatus(value);

        if (
            currentStatus !== lastStatus
        ) {

            status.textContent =
                currentStatus;

            lastStatus =
                currentStatus;

        }

        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            percentage.textContent =
                "100%";

            progressBar.style.width =
                "100%";

            status.textContent =
                "System ready";

            setTimeout(() => {

                window.location.replace(
                    "login.html"
                );

            }, redirectDelay);

        }

    }

    requestAnimationFrame(
        animate
    );
}

window.addEventListener(
    "load",
    () => {

        setTimeout(
            startLoader,
            startDelay
        );

    }
);

</script>

</body>

</html>
